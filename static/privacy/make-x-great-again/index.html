<h1>Make X Great Again 隐私政策</h1>
<p>更新于 2026 年 11 月 19 日</p>
<p>扩展在 x.com 页面内读取 X 已发起的帖子和关注请求响应，从中提取作者信息、关注关系、帖子链接等功能所需字段，并在当前页面使用。关注、取关、屏蔽、翻译和反馈由用户点击后通过 X 的原有功能处理。扩展没有独立服务器接收这些信息。</p>
<p>本扩展按 Chrome 应用商店用户数据政策及其限定用途要求使用用户数据。</p>
