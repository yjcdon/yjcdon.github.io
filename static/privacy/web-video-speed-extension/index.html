<h1>网页视频长按倍速 隐私政策</h1>
<p>更新于 2026 年 11 月 19 日</p>
<p>扩展在浏览器内识别视频、键盘操作和播放状态，以响应用户的播放控制。扩展将倍率偏好保存在 Chrome 同步存储。启用 Chrome 同步时，Chrome 可在登录同一账号的设备间同步该偏好。开发者服务器不接收网页内容、键盘操作或倍率偏好。</p>
<p>本扩展按 Chrome 应用商店用户数据政策及其限定用途要求使用用户数据。</p>
